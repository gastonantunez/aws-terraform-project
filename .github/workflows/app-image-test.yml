name: App Image Security Test

on:
  push:
    branches:
      - test-trivy
    paths:
      - "app/**"
      - ".github/workflows/app-image-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Build and compare Trivy scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mi-app:security-test ./app

      - name: Verify runtime image without pip
        run: |
          docker run --rm mi-app:security-test python -c '
          import importlib.util
          import pathlib
          import sys

          print("Python:", sys.version)
          print("pip available:", importlib.util.find_spec("pip") is not None)
          print("Working directory:", pathlib.Path.cwd())

          app = pathlib.Path("/app/app.py")
          print("Application file exists:", app.is_file())

          if importlib.util.find_spec("pip") is not None:
              raise SystemExit("ERROR: pip is still available in the runtime image")

          if not app.is_file():
              raise SystemExit("ERROR: /app/app.py is missing")
          '

      - name: Baseline scan - runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mi-app:security-test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Diagnostic scan - skip former pip SBOM path
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mi-app:security-test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
          skip-files: /usr/local/lib/python3.13/site-packages/pip/_vendor/bom.cdx.json
