name: App Image Security Test

on:
  push:
    branches:
      - test-trivy
    paths:
      - "app/**"
      - ".github/workflows/app-image-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Build and compare Trivy scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mi-app:security-test ./app

      - name: Inspect Python packages and pip SBOM
        run: |
          docker run --rm mi-app:security-test python -c '
          import importlib.metadata as metadata
          import pathlib
          import pip
          import sys

          print("Python:", sys.version)
          print("pip:", pip.__version__)

          vendor = pathlib.Path(pip.__file__).parent / "_vendor"
          sbom = vendor / "bom.cdx.json"

          print("Vendor directory:", vendor)
          print("Embedded SBOM exists:", sbom.exists())

          for name in ("msgpack", "urllib3"):
              try:
                  module = __import__("pip._vendor." + name, fromlist=["*"])
                  print(f"{name} vendored version:", getattr(module, "__version__", "unknown"))
                  print(f"{name} module path:", getattr(module, "__file__", "unknown"))
              except Exception as error:
                  print(f"{name} import error:", repr(error))

          for name in ("msgpack", "setuptools", "urllib3"):
              try:
                  print(f"{name} installed distribution:", metadata.version(name))
              except metadata.PackageNotFoundError:
                  print(f"{name} installed distribution: NOT FOUND")

          if sbom.exists():
              content = sbom.read_text(errors="replace")
              for package in (
                  "msgpack@1.1.2",
                  "setuptools@70.3.0",
                  "urllib3@2.7.0",
              ):
                  print(f"SBOM contains {package}: {package in content}")
          '

      - name: Baseline scan - original image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mi-app:security-test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Diagnostic scan - skip pip embedded SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mi-app:security-test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
          skip-files: /usr/local/lib/python3.13/site-packages/pip/_vendor/bom.cdx.json
