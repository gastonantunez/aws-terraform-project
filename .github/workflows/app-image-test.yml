name: App Image Security Test

on:
  push:
    branches:
      - test-trivy
    paths:
      - "app/**"
      - ".github/workflows/app-image-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Build and scan application image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mi-app:security-test ./app

      - name: Inspect Python packages and pip SBOM
        run: |
          docker run --rm mi-app:security-test python -c '
          import importlib.metadata as metadata
          import pathlib
          import pip
          import sys

          root = pathlib.Path(pip.__file__).parent
          vendor = root / "_vendor"
          sbom = vendor / "bom.cdx.json"

          print("Python:", sys.version)
          print("pip:", pip.__version__)
          print("pip vendor directory:", vendor)

          for name in ("msgpack", "setuptools", "urllib3"):
              try:
                  print(f"{name} installed version: {metadata.version(name)}")
              except metadata.PackageNotFoundError:
                  print(f"{name} installed version: NOT INSTALLED")

              matches = [
                  str(path.relative_to(vendor))
                  for path in vendor.rglob("*")
                  if path.name == name or path.name.startswith(name + "-")
              ] if vendor.exists() else []

              print(f"{name} paths inside pip vendor: {matches[:20]}")

          print("Embedded pip SBOM:", sbom)
          print("SBOM exists:", sbom.exists())

          if sbom.exists():
              content = sbom.read_text(errors="replace")
              for package in (
                  "msgpack@1.1.2",
                  "setuptools@70.3.0",
                  "urllib3@2.7.0",
              ):
                  print(f"SBOM contains {package}: {package in content}")
          '

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mi-app:security-test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
