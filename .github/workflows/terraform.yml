name: Terraform

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::183004895136:role/github-actions-terraform
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/mi-app:${{ env.IMAGE_TAG }} \
            ./app

      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/mi-app:${{ env.IMAGE_TAG }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Test SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-02f515a0579fe8bbc" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker ps"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-02f515a0579fe8bbc"

          echo "Docker containers:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-02f515a0579fe8bbc" \
            --query "StandardOutputContent" \
            --output text

      - name: Deploy to EC2
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-02f515a0579fe8bbc" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 183004895136.dkr.ecr.us-east-1.amazonaws.com","docker pull 183004895136.dkr.ecr.us-east-1.amazonaws.com/mi-app:${{ env.IMAGE_TAG }}","docker stop mi-app-container || true","docker rm mi-app-container || true","docker run -d --name mi-app-container --restart always -p 3000:3000 183004895136.dkr.ecr.us-east-1.amazonaws.com/mi-app:${{ env.IMAGE_TAG }}","sleep 5","docker ps --filter name=mi-app-container --filter status=running --format \"{{.Names}}\"","wget -q -O /dev/null http://localhost && echo NGINX_HEALTH_OK"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Deploy Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-02f515a0579fe8bbc"

          echo "Deployment result:"

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-02f515a0579fe8bbc" \
            --query "StandardOutputContent" \
            --output text)

          echo "$RESULT"

          if [[ "$RESULT" != *"mi-app-container"* ]]; then
            echo "ERROR: mi-app-container is not running."
            exit 1
          fi

          if [[ "$RESULT" != *"NGINX_HEALTH_OK"* ]]; then
            echo "ERROR: Nginx health check failed."
            exit 1
          fi

          echo "Deployment successful: container is running and Nginx health check passed."