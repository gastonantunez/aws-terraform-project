name: AI Security Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ai-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-security:
    name: Static security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run Trivy IaC and configuration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig,secret
          severity: HIGH,CRITICAL,MEDIUM
          exit-code: '0'
          format: json
          output: trivy-config.json

      - name: Run Checkov Terraform scan
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: json
          output_file_path: checkov.json

      - name: Upload static security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-security-reports
          path: |
            trivy-config.json
            checkov.json
          if-no-files-found: ignore
          retention-days: 7

  ai-review:
    name: Gemini AI review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: static-security
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      # The review script is checked out from the trusted base commit,
      # never from the pull-request branch.
      - name: Checkout trusted review code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      # This checkout is data-only. Never execute scripts or workflows from this directory.
      - name: Checkout pull request source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-src
          fetch-depth: 0
          persist-credentials: false

      - name: Download static scan report
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: static-security-reports
          path: reports
        continue-on-error: true

      - name: Build review diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C pr-src diff --no-ext-diff --unified=5 "$BASE_SHA...$HEAD_SHA" -- . ':!*.lock' > pr.diff
          echo "Diff size: $(wc -c < pr.diff) bytes"

      - name: Run AI security review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_API_URL: ${{ github.api_url }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python trusted/.github/scripts/ai_security_review.py

      - name: Upload AI review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-security-review
          path: ai-security-review.md
          if-no-files-found: ignore
          retention-days: 7
